name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag (version) to be released (ex: 1.2.3).'
        type: string
        required: true

      create-github-release:
        description: 'Create a source-only GitHub release for the tag (no binary artifact). SPM consumers build AEPTestUtils from source via this tag. If the provided `tag` does not exist, it will be created.'
        type: boolean
        required: true
        default: true

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: shushinde/aepsdk-commons/.github/workflows/ios-spm-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag }}
      # AEPTestUtils is a test-only library (subclasses XCTestCase and reaches into
      # AEPCore/AEPServices @testable/non-open internals), so it has no valid distributable
      # module interface and cannot be shipped as an XCFramework. It is consumed purely as an
      # SPM source dependency in consumers' test targets, so this is a tag-only release.
      create-github-release: ${{ github.event.inputs.create-github-release == 'true' && 'AEPTestUtils' || '' }}
      tag-only: true
      xcode-version: '26.3.0'
      simulator-platforms: 'iOS, tvOS'
      version-validation-paths: AEPTestUtils.xcodeproj/project.pbxproj
    secrets: inherit
